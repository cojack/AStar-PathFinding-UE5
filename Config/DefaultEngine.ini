[CoreRedirects]
; UPathFinding and APathFindingGrid moved from the TP1 game module into the
; AStarPathFinding plugin. Without these, BP_Player and MainMap silently lose the
; component - no compile error, just a missing component at runtime. See docs/ADR.md ADR-0010.
+ClassRedirects=(OldName="/Script/TP1.PathFinding",NewName="/Script/AStarPathFinding.PathFinding")
+ClassRedirects=(OldName="/Script/TP1.PathFindingGrid",NewName="/Script/AStarPathFinding.PathFindingGrid")
; The TP1 module no longer declares any reflected types, so UHT stops emitting a
; /Script/TP1 package and the assets' package-level import dangles. Redirect the package
; itself, not just the classes.
+PackageRedirects=(OldName="/Script/TP1",NewName="/Script/AStarPathFinding")
